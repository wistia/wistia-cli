releaseNotes: "## Cli SDK Changes:\n* `Wistia.CustomMetadataFieldDefinitions.Post/customMetadataFieldDefinitions()`:  `request.Request` **Changed** (Breaking ⚠️)\n* `Wistia.CustomMetadataFieldDefinitions.Put/customMetadataFieldDefinitions/{key}()`: \n  *  `request.Request.Body.Config` **Changed** (Breaking ⚠️)\n* `Wistia.CustomMetadataFieldValues.Put/medias/{mediaHashedId}/customMetadataFieldValues/{key}()`: \n  *  `request.Request.Body.Value.union(class (4))` **Removed** (Breaking ⚠️)\n* `Wistia.DeletedMedia.List()`: **Added**\n* `Wistia.DeletedMedia.Restore()`: **Added**\n* `Wistia.BulkActions.Create()`: **Added**\n* `Wistia.DeletedMedia.Get/deletedMedia()`: **Removed** (Breaking ⚠️)\n* `Wistia.DeletedMedia.Post/deletedMedia/restore()`: **Removed** (Breaking ⚠️)\n* `Wistia.BulkActions.Post/bulk()`: **Removed** (Breaking ⚠️)\n* `Wistia.Subfolders.Update()`:  `error.status[403]` **Added**\n* `Wistia.Subfolders.Delete()`:  `error.status[403]` **Added**\n"
