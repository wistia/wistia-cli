releaseNotes: "## Cli SDK Changes:\n* `Wistia.Captions.Purchase()`: \n  *  `request.Request.Body.Automated` **Changed** (Breaking ⚠️)\n* `Wistia.AnalyticsAccount.GetTopContent()`:  `response.[]` **Changed** (Breaking ⚠️)\n* `Wistia.Bulk.Purchase()`: \n  *  `request.Request.Actions[].Operation` **Changed** (Breaking ⚠️)\n* `Wistia.MediaExtendedAudioDescriptions.Get/mediaExtendedAudioDescriptions/orderStatus/{id}()`:  `response` **Changed** (Breaking ⚠️)\n* `Wistia.MediaExtendedAudioDescriptions.Post/mediaExtendedAudioDescriptions/order()`: \n  *  `request.Request` **Changed** (Breaking ⚠️)\n  *  `response` **Changed** (Breaking ⚠️)\n* `Wistia.Localizations.Delete()`:  `response` **Changed** (Breaking ⚠️)\n* `Wistia.Localizations.Get()`:  `response` **Changed** (Breaking ⚠️)\n* `Wistia.Localizations.Create()`:  `response` **Changed** (Breaking ⚠️)\n* `Wistia.Localizations.List()`:  `response.[]` **Changed** (Breaking ⚠️)\n* `Wistia.Captions.Update()`:  `error.status[404]` **Added**\n* `Wistia.PronunciationWords.Post/pronunciationWords/{pronunciationWordId}/preview()`: **Added**\n* `Wistia.Remix.Post/remixes/{remixHashedId}/export()`: **Removed** (Breaking ⚠️)\n* `Wistia.Remix.Get/remixAccountStatus()`: **Removed** (Breaking ⚠️)\n* `Wistia.Media.List()`:  `response.[]` **Changed**\n* `Wistia.Media.Get()`:  `response` **Changed**\n* `Wistia.Media.Delete()`:  `error.status[422]` **Added**\n* `Wistia.Remix.Get/remixes/{remixHashedId}()`: **Removed** (Breaking ⚠️)\n* `Wistia.Captions.Get()`:  `error.status[404]` **Added**\n* `Wistia.AccountActivity.Get/accountActivity()`: **Added**\n* `Wistia.Captions.UpdateMultipart()`:  `error.status[404]` **Added**\n* `Wistia.Captions.Delete()`:  `error.status[404]` **Added**\n* `Wistia.Remix.Post/remixes()`: **Removed** (Breaking ⚠️)\n* `Wistia.Remix.Post/remixes/{remixHashedId}/continue()`: **Removed** (Breaking ⚠️)\n* `Wistia.PronunciationWords.Delete/pronunciationWords/{pronunciationWordId}()`: **Added**\n* `Wistia.PronunciationWords.Put/pronunciationWords/{pronunciationWordId}()`: **Added**\n* `Wistia.PronunciationWords.Post/pronunciationWords()`: **Added**\n* `Wistia.PronunciationWords.Get/pronunciationWords()`: **Added**\n* `Wistia.BulkActions.Create()`:  `request.Request` **Changed**\n* `Wistia.Account.UpdateTranscriptSettings()`: **Added**\n* `Wistia.Account.Get()`:  `response.DomainRestriction` **Added**\n* `Wistia.Account.GetUsage()`:  `response.Rates` **Added**\n* `Wistia.Search.Search()`: \n  *  `request.Request` **Changed**\n  *  `response.Content[]` **Changed**\n* `Wistia.ExpiringAccessTokens.Create()`: \n  *  `request.Request.ExpiringAccessToken.Authorizations[].union(account).Permissions[].Enum(manageTranscriptSettings)` **Added**\n* `Wistia.BackgroundJobStatus.Get()`:  `response.BackgroundJobStatus` **Changed**\n* `Wistia.StatsEvents.List()`:  `error.status[404]` **Added**\n* `Wistia.Channels.GetCustomizations()`: **Added**\n"
