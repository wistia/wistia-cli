releaseNotes: "## Cli SDK Changes:\n* `Wistia.CustomMetadataFieldDefinitions.Post/customMetadataFieldDefinitions()`:  `request.Request` **Changed** (Breaking ⚠️)\n* `Wistia.ExpiringAccessTokens.Create()`: \n  *  `request.Request.ExpiringAccessToken.Authorizations[]` **Changed** (Breaking ⚠️)\n* `Wistia.CustomMetadataFieldValues.Put/medias/{mediaHashedId}/customMetadataFieldValues/{key}()`: \n  *  `request.Request.Body.Value.union(class (4))` **Removed** (Breaking ⚠️)\n* `Wistia.CustomMetadataFieldDefinitions.Put/customMetadataFieldDefinitions/{key}()`: \n  *  `request.Request.Body.Config` **Changed** (Breaking ⚠️)\n* `Wistia.Captions.Purchase()`:  `error.status[403]` **Added**\n* `Wistia.Bulk.Purchase()`:  `error.status[403]` **Added**\n* `Wistia.DeletedMedia.Post/deletedMedia/restore()`: **Removed** (Breaking ⚠️)\n* `Wistia.BulkActions.Post/bulk()`: **Removed** (Breaking ⚠️)\n* `Wistia.BulkActions.Create()`: **Added**\n* `Wistia.Speakers.Delete()`: **Added**\n* `Wistia.Customizations.Update()`:  `error.status[403]` **Added**\n* `Wistia.Customizations.Delete()`:  `error.status[403]` **Added**\n* `Wistia.DeletedMedia.List()`: **Added**\n* `Wistia.Speakers.Update()`: **Added**\n* `Wistia.Trims.Create()`:  `error.status[404]` **Added**\n* `Wistia.DeletedMedia.Get/deletedMedia()`: **Removed** (Breaking ⚠️)\n* `Wistia.Folders.Copy()`:  `error.status[403]` **Added**\n* `Wistia.FolderSharings.Update()`:  `error.status[403]` **Added**\n* `Wistia.FolderSharings.Delete()`:  `error.status[403]` **Added**\n* `Wistia.Subfolders.Update()`:  `error.status[403]` **Added**\n* `Wistia.Subfolders.Delete()`:  `error.status[403]` **Added**\n* `Wistia.ChannelCollaborators.Create()`:  `error.status[403]` **Added**\n* `Wistia.ChannelCollaborators.Delete()`:  `error.status[403]` **Added**\n* `Wistia.WebinarCollaborators.Create()`:  `error.status[403]` **Added**\n* `Wistia.WebinarCollaborators.Delete()`:  `error.status[403]` **Added**\n* `Wistia.DeletedMedia.Restore()`: **Added**\n* `Wistia.Remix.Get/remixAccountStatus()`:  `response.Summary` **Added**\n"
